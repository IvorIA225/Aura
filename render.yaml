services:
  - type: web
    name: poc-whatsapp-support
    runtime: docker
    plan: free
    region: frankfurt # ou oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: LLM_MODEL
        value: groq/qwen/qwen3.8-27b
      - key: LLM_MODEL_FAST
        value: groq/groq/compound-mini
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
